# analysis_options.yaml configurează analizorul Dart, care verifică codul fără să-l ruleze.
# Problemele găsite apar în editor sau cu comanda `flutter analyze`.

# Activează regulile recomandate pentru aplicațiile Flutter, din pachetul flutter_lints.
include: package:flutter_lints/flutter.yaml

analyzer:
  # Fișierele pe care analizorul nu le verifică: codul generat și proiectele pentru platforme.
  exclude:
    - build/**
    - android/**
    - web/**

linter:
  # Aici se pot activa reguli noi (nume_regula: true) sau dezactiva reguli existente (false).
  rules:

# Setările pentru `dart format`, care aranjează automat codul.
formatter:
  # Lungimea maximă a unui rând, în caractere.
  page_width: 100

  # Păstrează virgulele de la finalul listelor de parametri, ca fiecare parametru să stea pe
  # rândul lui.
  trailing_commas: preserve
