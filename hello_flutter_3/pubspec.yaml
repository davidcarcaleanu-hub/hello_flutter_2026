# pubspec.yaml descrie proiectul: numele, versiunea și pachetele de care are nevoie.
# Seamănă cu package.json din JavaScript sau cu pom.xml din Java.

# Numele pachetului, folosit în importuri: package:hello_flutter_3/...
name: hello_flutter_3

# O descriere scurtă a proiectului.
description: "A treia aplicație Flutter: un ecran cu bară de sus, meniu, imagine și buton plutitor."

# Împiedică publicarea accidentală a proiectului pe pub.dev, depozitul public de pachete Dart.
publish_to: 'none'

# Versiunea aplicației (1.0.0) și numărul build-ului (după +).
version: 1.0.0+1

# Versiunea de Dart necesară: ^ înseamnă 3.14.0 sau mai nouă, dar sub 4.0.0.
environment:
  sdk: ^3.14.0

# Pachetele de care aplicația are nevoie ca să ruleze.
dependencies:
  # Framework-ul Flutter, inclus în SDK.
  flutter:
    sdk: flutter

  # Widget-urile Material Design, descărcate de pe pub.dev.
  material_ui: ^1.11.0

# Pachetele folosite doar în timpul dezvoltării, care nu ajung în aplicația finală.
dev_dependencies:
  # Instrumentele pentru teste, folosite de `flutter test`.
  flutter_test:
    sdk: flutter

  # Regulile recomandate de verificare a codului, activate în analysis_options.yaml.
  flutter_lints: ^6.0.0

# Setările specifice Flutter.
flutter:
  # Include fontul cu iconițele Material, folosite prin clasa Icons.
  uses-material-design: true

  # Tot aici se adaugă, mai târziu, imagini (assets) și fonturi proprii.
